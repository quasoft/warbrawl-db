<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WarBrawl Database</title>
<meta name="description" content="Browse every perk, status effect, ability and attack in WarBrawl, plan a weapon's ability tree, and work out damage.">
<meta property="og:title" content="WarBrawl">
<meta property="og:description" content="Browse every perk, status effect, ability and attack in WarBrawl, plan a weapon's ability tree, and work out damage.">
<meta property="og:image" content="https://db.warbrawl.com/preview.jpg">
<meta property="og:url" content="https://db.warbrawl.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="WarBrawl Database">
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="style.css?v=0.5.1-20260912-124611">
</head>
<body>
<header class="topbar">
  <button class="nav-toggle" id="nav-toggle" type="button"
          aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="#perks">
    <span class="brand-mark">WB</span>
    <span class="brand-text">WarBrawl <em>Database</em></span>
  </a>
  <div class="search input-wrap">
    <input id="global-search" type="search" autocomplete="off" spellcheck="false"
           placeholder="Search perks, statuses, abilities, attacks ...">
    <kbd class="hotkey">/</kbd>
    <div id="search-results" class="search-results" hidden></div>
  </div>
  <a class="site-link" href="https://warbrawl.com">warbrawl.com
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
  </a>
</header>

<div class="layout">
  <div class="nav-scrim" id="nav-scrim"></div>
  <nav class="sidebar" id="sidebar">
    <div id="nav-items"></div>
    <!-- Version + build stamp under the nav; the phone footer is its twin, so
         both carry classes rather than ids and the script fills every copy. -->
    <div class="stamp stamp-side">
      <span class="version"></span>
      <span class="generated"></span>
    </div>
  </nav>

  <main class="content">
    <div class="list-pane">
      <div class="list-head">
        <h1 id="section-title"></h1>
        <p id="section-blurb" class="blurb"></p>
        <div class="controls">
          <div class="input-wrap filter-wrap">
            <input id="filter" type="search" autocomplete="off" spellcheck="false"
                   placeholder="Filter this table ...">
            <kbd class="hotkey">Ctrl + K</kbd>
          </div>
          <div id="facets" class="facets"></div>
        </div>
      </div>
      <div class="table-wrap">
        <div id="custom" class="custom" hidden></div>
        <table id="table">
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
        <p id="empty" class="empty" hidden>Nothing matches that filter.</p>
      </div>
    </div>

    <aside class="detail-pane" id="detail-pane">
      <button class="detail-close" id="detail-close" type="button" aria-label="Close details">&times;</button>
      <div id="detail" class="detail"></div>
    </aside>
  </main>
</div>

<footer class="stamp stamp-footer">
  <span class="version"></span>
  <span class="generated"></span>
</footer>

<script src="data.js?v=0.5.1-20260912-124611"></script>
<script src="app.js?v=0.5.1-20260912-124611"></script>
</body>
</html>
